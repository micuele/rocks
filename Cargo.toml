[package]
name = "rocks"
version = "0.1.0"
edition = "2024"
authors = [
  "Michele Qirici <51047047+micuele@users.noreply.github.com>",
  "Matthias Gabriel <gabm+aur@mailbox.org>",
]
description = "Screenshot annotation with numbered comments for Linux."
license = "MPL-2.0"
repository = "https://github.com/micuele/rocks"
readme = "README.md"
include = [
  "src/**/*",
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE*",
  "README.md",
  "assets/",
  "build.rs"
]

[dependencies]
relm4 = { version = "0.10.1", features = ["macros", "libadwaita", "gnome_42"] }
tempfile = "3.27"

# error handling
anyhow = "1.0"
thiserror = "2.0"

# command line
clap = { version = "4.6.4", features = ["derive"] }

# configuration file
xdg = "^3.0"
toml = "1.1.3"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4.44"

# opengl rendering backend
femtovg = "0.26.0"
libloading = "0.9"
epoxy = "0.1.0"
glow = "0.18.0"
resource = "0.6.1"  # font embedding
keycode = "1.0.0"

[dependencies.relm4-icons]
version = "0.10.0"


[build-dependencies]
relm4-icons-build = "0.11"
